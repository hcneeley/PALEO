<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unified Paleontology API Engine</title>
    <meta
      name="description"
      content="Search taxa, minerals, and places across paleontology, geology, and biodiversity sources in one view."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <header class="hero">
        <h1 class="brand">Unified Paleontology API Engine</h1>
        <p class="lede">
          Federate fossils, strata, specimens, minerals, climate proxies, and
          literature from a single query.
        </p>
      </header>

      <form id="search-form" class="search" autocomplete="off">
        <label class="field field-wide">
          <span>Taxon or mineral</span>
          <input
            id="taxon"
            name="taxon"
            type="search"
            placeholder="Canis dirus, Hadrosaurus, quartz…"
            autofocus
          />
        </label>
        <div class="field-row">
          <label class="field">
            <span>Latitude</span>
            <input id="lat" name="lat" type="number" step="any" placeholder="34.05" />
          </label>
          <label class="field">
            <span>Longitude</span>
            <input id="lng" name="lng" type="number" step="any" placeholder="-118.25" />
          </label>
          <label class="field">
            <span>Radius (km)</span>
            <input
              id="radius_km"
              name="radius_km"
              type="number"
              step="any"
              min="0"
              placeholder="500"
            />
          </label>
        </div>
        <div class="field-row field-row-3">
          <label class="field">
            <span>Age min (younger, Ma)</span>
            <input id="age_min" name="age_min" type="number" step="any" min="0" placeholder="0.01" />
          </label>
          <label class="field">
            <span>Age max (older, Ma)</span>
            <input id="age_max" name="age_max" type="number" step="any" min="0" placeholder="2.5" />
          </label>
          <label class="field">
            <span>Results per source</span>
            <input
              id="limit"
              name="limit"
              type="number"
              step="1"
              min="1"
              max="300"
              value="50"
            />
          </label>
        </div>
        <label class="check-field">
          <input id="load_all" name="load_all" type="checkbox" />
          <span>Load all available occurrence pages (progressive)</span>
        </label>
        <div class="actions">
          <button type="submit" id="submit-btn">Synthesize</button>
          <button type="button" id="example-btn" class="ghost">Try Canis dirus @ LA</button>
          <button type="button" id="clear-btn" class="ghost">Clear all</button>
        </div>
        <p id="form-hint" class="hint">Provide a taxon/mineral and/or lat + lng.</p>
      </form>

      <section id="status" class="status" hidden></section>
      <section id="results" class="results" hidden></section>
    </main>
    <footer class="foot">
      <a href="https://upae-ff1k.onrender.com/api/v1/">API</a>
      <a href="https://github.com/hcneeley/upae">GitHub</a>
    </footer>
    <script src="./app.js"></script>
  </body>
</html>
